name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip newest zip
        run: |
          NEWEST=$(for f in *.zip; do echo "$(git log -1 --format=%ct -- "$f")|$f"; done | sort -n | tail -1 | cut -d'|' -f2-)
          echo "Using: $NEWEST"
          unzip -q "$NEWEST"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
        working-directory: TestEvidence
      - uses: actions/upload-artifact@v4
        with:
          name: TestEvidence-apk
          path: TestEvidence/app/build/outputs/apk/debug/app-debug.apk
